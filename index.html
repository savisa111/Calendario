```html
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario condiviso</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 { margin: 0 0 20px; }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .date-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-row input {
      flex: 1;
      min-width: 0;
    }

    input, select, button {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    input, select { width: 100%; }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: 0;
      width: auto;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: #4b5563;
      font-size: .9rem;
    }

    .event {
      border-left: 6px solid;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: opacity .2s, box-shadow .2s;
    }

    .event:hover {
      box-shadow: 0 2px 8px #00000012;
    }

    .personale {
      border-color: #dc2626;
      background: #fee2e2;
      color: #991b1b;
    }

    .lavoro {
      border-color: #16a34a;
      background: #dcfce7;
      color: #166534;
    }

    .bambini {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .event-info {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .event-title { font-weight: 700; }

    .event-details {
      color: inherit;
      font-size: .93rem;
      margin-top: 3px;
    }

    .event-status {
      font-size: .85rem;
      font-weight: 700;
      margin-top: 5px;
    }

    .event.completed { opacity: .65; }

    .event.completed .event-title,
    .event.completed .event-details {
      text-decoration: line-through;
    }

    .delete {
      flex-shrink: 0;
      background: #fee2e2;
      color: #991b1b;
      padding: 7px 10px;
    }

    .delete:hover { background: #fecaca; }

    #status {
      color: #6b7280;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }

    #message {
      min-height: 24px;
      font-weight: 600;
      color: #15803d;
    }

    #message.error { color: #b91c1c; }

    .empty {
      color: #6b7280;
      padding: 12px 0;
    }

    .hint {
      color: #6b7280;
      font-size: .88rem;
      font-weight: 400;
    }

    @media (max-width: 480px) {
      .date-row { flex-wrap: wrap; }

      .date-row input {
        flex-basis: 100%;
        order: -1;
      }

      .card { padding: 16px; }

      .event {
        gap: 8px;
        padding: 10px;
      }

      .delete { padding: 7px 8px; }
    }
  </style>
</head>

<body>
  <h1>Calendario condiviso</h1>

  <section class="card">
    <div class="date-row">
      <button class="secondary" id="prevDay"
        type="button" aria-label="Giorno precedente">←</button>

      <input id="selectedDate" type="date"
        aria-label="Seleziona il giorno">

      <button class="secondary" id="nextDay"
        type="button" aria-label="Giorno successivo">→</button>

      <button class="secondary" id="today"
        type="button">Oggi</button>
    </div>

    <h2 id="dayHeading"></h2>

    <div class="legend">
      <span>🔴 Personali</span>
      <span>🟢 Lavoro</span>
      <span>🔵 Bambini</span>
    </div>

    <p id="status" role="status" aria-live="polite">
      Connessione a Firebase in corso…
    </p>

    <label for="eventFilter">Filtra gli eventi</label>
    <select id="eventFilter">
      <option value="tutti">Tutti gli eventi</option>
      <option value="da-fare">Solo eventi da fare</option>
      <option value="completati">Solo eventi completati</option>
    </select>

    <div id="events"></div>
  </section>

  <section class="card">
    <h2>Inserisci un nuovo evento</h2>

    <form id="eventForm">
      <label for="title">Descrizione dell'evento</label>
      <input
        id="title"
        type="text"
        placeholder="Es. Visita dal dentista"
        required
        maxlength="100"
      >

      <label for="category">Categoria</label>
      <select id="category" required>
        <option value="personale">🔴 Evento personale</option>
        <option value="lavoro">🟢 Appuntamento di lavoro</option>
        <option value="bambini">🔵 Evento riguardante i bambini</option>
      </select>

      <label for="time">Ora dell'evento</label>
      <input id="time" type="time" required>

      <label for="duration">Durata (in minuti)</label>
      <input
        id="duration"
        type="number"
        min="1"
        step="1"
        value="60"
        required
      >

      <label for="recurrence">Ripetizione dell'evento</label>
      <select id="recurrence" required>
        <option value="none">Nessuna ripetizione</option>
        <option value="weekly">Ogni settimana</option>
        <option value="monthly">Ogni mese</option>
        <option value="yearly">Ogni anno</option>
      </select>

      <p class="hint">
        Gli eventi ricorrenti si ripetono dalla data selezionata,
        senza una data di fine. Puoi completarli separatamente
        in ogni data.
      </p>

      <button id="submitButton" type="submit">
        Aggiungi evento
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Firebase compat: non richiede import o bundler -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // ==========================================
    // 1. CONFIGURAZIONE DEL TUO PROGETTO FIREBASE
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyCzr5suVS8q99U8JXdg5maA8wwp7ZGiAzg",
      authDomain: "calendario-condiviso-2235a.firebaseapp.com",
      databaseURL: "https://calendario-condiviso-2235a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "calendario-condiviso-2235a",
      storageBucket: "calendario-condiviso-2235a.firebasestorage.app",
      messagingSenderId: "156410352687",
      appId: "1:156410352687:web:db4b50d3a5cd7acdd9a2da",
      measurementId: "G-8GMK029EPR"
    };

    // ==========================================
    // 2. ELEMENTI E VARIABILI
    // ==========================================

    const dateInput = document.getElementById("selectedDate");
    const eventsContainer = document.getElementById("events");
    const statusEl = document.getElementById("status");
    const messageEl = document.getElementById("message");
    const eventForm = document.getElementById("eventForm");
    const eventFilter = document.getElementById("eventFilter");
    const submitButton = document.getElementById("submitButton");

    let database = null;
    let eventsRef = null;
    let currentListener = null;
    let latestSnapshot = null;

    // ==========================================
    // 3. DATE LOCALI
    // ==========================================

    function localDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day, 12, 0, 0);
    }

    function updateHeading() {
      if (!dateInput.value) return;

      document.getElementById("dayHeading").textContent =
        new Intl.DateTimeFormat("it-IT", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(parseLocalDate(dateInput.value));
    }

    // ==========================================
    // 4. CALCOLO DELLE RICORRENZE
    // ==========================================

    function occursOn(event, dateString) {
      if (!event.date || dateString < event.date) {
        return false;
      }

      const recurrence = event.recurrence || "none";

      if (recurrence === "none") {
        return dateString === event.date;
      }

      const originalDate = parseLocalDate(event.date);
      const targetDate = parseLocalDate(dateString);

      if (recurrence === "weekly") {
        return originalDate.getDay() === targetDate.getDay();
      }

      if (recurrence === "monthly") {
        return originalDate.getDate() === targetDate.getDate();
      }

      if (recurrence === "yearly") {
        return originalDate.getDate() === targetDate.getDate()
          && originalDate.getMonth() === targetDate.getMonth();
      }

      return dateString === event.date;
    }

    function recurrenceLabel(recurrence) {
      switch (recurrence) {
        case "weekly": return "Ogni settimana";
        case "monthly": return "Ogni mese";
        case "yearly": return "Ogni anno";
        default: return "";
      }
    }

    // ==========================================
    // 5. COMPLETAMENTO DELLE SINGOLE OCCORRENZE
    // ==========================================

    function isCompleted(event, occurrenceDate) {
      const completedDates = event.completedDates || {};

      if (
        Object.prototype.hasOwnProperty.call(
          completedDates, occurrenceDate
        )
      ) {
        return completedDates[occurrenceDate] === true;
      }

      // Compatibilità con gli eventi creati con la
      // versione precedente del calendario.
      if (!event.recurrence || event.recurrence === "none") {
        return event.completed === true;
      }

      return false;
    }

    async function toggleCompleted(event, occurrenceDate) {
      if (!eventsRef) return;

      const newStatus = !isCompleted(event, occurrenceDate);

      try {
        await eventsRef
          .child(event.id)
          .child("completedDates")
          .child(occurrenceDate)
          .set(newStatus);
      } catch (error) {
        alert(
          "Impossibile salvare il completamento. " +
          "Controlla la connessione e i permessi Firebase."
        );

        console.error("Errore completamento:", error);
      }
    }

    // ==========================================
    // 6. MOSTRA GLI EVENTI E APPLICA IL FILTRO
    // ==========================================

    function showEvents(snapshot) {
      eventsContainer.replaceChildren();

      if (!snapshot) return;

      const selectedDate = dateInput.value;
      const filter = eventFilter.value;
      const events = [];

      snapshot.forEach(child => {
        const event = child.val();

        if (!event || !event.title || !event.date) return;

        if (occursOn(event, selectedDate)) {
          events.push({
            id: child.key,
            ...event
          });
        }
      });

      events.sort((a, b) =>
        (a.time || "").localeCompare(b.time || "")
      );

      const filteredEvents = events.filter(event => {
        const completed = isCompleted(event, selectedDate);

        if (filter === "da-fare") return !completed;
        if (filter === "completati") return completed;

        return true;
      });

      if (filteredEvents.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";

        if (events.length === 0) {
          empty.textContent = "Nessun evento per questo giorno.";
        } else if (filter === "da-fare") {
          empty.textContent = "Non ci sono eventi da fare.";
        } else {
          empty.textContent = "Non ci sono eventi completati.";
        }

        eventsContainer.appendChild(empty);
        return;
      }

      for (const event of filteredEvents) {
        const occurrenceDate = selectedDate;
        const completed = isCompleted(event, occurrenceDate);

        const item = document.createElement("div");
        const categories = ["personale", "lavoro", "bambini"];

        const category = categories.includes(event.category)
          ? event.category
          : "personale";

        item.className = `event ${category}`;

        if (completed) {
          item.classList.add("completed");
        }

        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-pressed", String(completed));
        item.setAttribute(
          "aria-label",
          `${event.title}. ${completed ? "Completato" : "Da fare"}. ` +
          "Premi Invio o clicca per cambiare stato."
        );

        item.title = completed
          ? "Clicca per segnare come da fare"
          : "Clicca per segnare come fatto";

        const info = document.createElement("div");
        info.className = "event-info";

        const title = document.createElement("div");
        title.className = "event-title";
        title.textContent = event.title;

        const details = document.createElement("div");
        details.className = "event-details";
        details.textContent =
          `${event.time || "--:--"} · ${event.duration || 60} minuti`;

        info.append(title, details);

        const repeat = recurrenceLabel(event.recurrence);

        if (repeat) {
          const repeatInfo = document.createElement("div");
          repeatInfo.className = "event-details";
          repeatInfo.textContent = `↻ ${repeat}`;
          info.appendChild(repeatInfo);
        }

        const eventStatus = document.createElement("div");
        eventStatus.className = "event-status";
        eventStatus.textContent = completed ? "✓ Fatto" : "Da fare";

        info.appendChild(eventStatus);

        const removeButton = document.createElement("button");
        removeButton.className = "delete";
        removeButton.type = "button";
        removeButton.textContent = "Elimina";

        removeButton.setAttribute(
          "aria-label", `Elimina ${event.title}`
        );

        removeButton.addEventListener("click", async clickEvent => {
          clickEvent.stopPropagation();

          const recurring =
            event.recurrence && event.recurrence !== "none";

          const question = recurring
            ? `Vuoi eliminare "${event.title}" e tutte le sue ripetizioni?`
            : `Vuoi eliminare "${event.title}"?`;

          if (!confirm(question)) return;

          try {
            await eventsRef.child(event.id).remove();
          } catch (error) {
            alert("Impossibile eliminare l'evento.");
            console.error("Errore eliminazione:", error);
          }
        });

        item.addEventListener("click", () => {
          toggleCompleted(event, occurrenceDate);
        });

        item.addEventListener("keydown", keyboardEvent => {
          if (
            keyboardEvent.target === item &&
            (
              keyboardEvent.key === "Enter" ||
              keyboardEvent.key === " "
            )
          ) {
            keyboardEvent.preventDefault();
            toggleCompleted(event, occurrenceDate);
          }
        });

        item.append(info, removeButton);
        eventsContainer.appendChild(item);
      }
    }

    // ==========================================
    // 7. SINCRONIZZAZIONE FIREBASE
    // ==========================================

    function listenForEvents() {
      updateHeading();

      if (!eventsRef) return;

      if (currentListener) {
        eventsRef.off("value", currentListener);
      }

      latestSnapshot = null;
      statusEl.textContent = "Connessione a Firebase in corso…";

      currentListener = snapshot => {
        latestSnapshot = snapshot;
        showEvents(snapshot);
        statusEl.textContent = "Calendario online e sincronizzato.";
      };

      eventsRef.on(
        "value",
        currentListener,
        error => {
          statusEl.textContent =
            "Errore Firebase: " + error.message;

          console.error("Errore lettura Firebase:", error);
        }
      );
    }

    // Il filtro usa l'ultimo snapshot ricevuto.
    eventFilter.addEventListener("change", () => {
      if (latestSnapshot) {
        showEvents(latestSnapshot);
      }
    });

    // ==========================================
    // 8. NAVIGAZIONE TRA I GIORNI
    // ==========================================

    dateInput.value = localDateString(new Date());

    document.getElementById("prevDay").addEventListener("click", () => {
      const date = parseLocalDate(dateInput.value);
      date.setDate(date.getDate() - 1);

      dateInput.value = localDateString(date);
      listenForEvents();
    });

    document.getElementById("nextDay").addEventListener("click", () => {
      const date = parseLocalDate(dateInput.value);
      date.setDate(date.getDate() + 1);

      dateInput.value = localDateString(date);
      listenForEvents();
    });

    document.getElementById("today").addEventListener("click", () => {
      dateInput.value = localDateString(new Date());
      listenForEvents();
    });

    dateInput.addEventListener("change", listenForEvents);

    // ==========================================
    // 9. INSERIMENTO DI UN NUOVO EVENTO
    // ==========================================

    eventForm.addEventListener("submit", async formEvent => {
      formEvent.preventDefault();

      messageEl.textContent = "";
      messageEl.classList.remove("error");

      if (!eventsRef) {
        messageEl.textContent = "Firebase non è connesso.";
        messageEl.classList.add("error");
        return;
      }

      const newEvent = {
        title: document.getElementById("title").value.trim(),
        category: document.getElementById("category").value,
        date: dateInput.value,
        time: document.getElementById("time").value,
        duration: Number(
          document.getElementById("duration").value
        ),
        recurrence: document.getElementById("recurrence").value,
        completed: false,
        createdAt: Date.now()
      };

      if (
        !newEvent.title ||
        !newEvent.date ||
        !newEvent.time ||
        !Number.isInteger(newEvent.duration) ||
        newEvent.duration < 1
      ) {
        messageEl.textContent = "Controlla i dati inseriti.";
        messageEl.classList.add("error");
        return;
      }

      submitButton.disabled = true;

      try {
        await eventsRef.push(newEvent);

        messageEl.textContent = "Appuntamento inserito correttamente.";

        eventForm.reset();
        document.getElementById("duration").value = 60;
        document.getElementById("recurrence").value = "none";
      } catch (error) {
        messageEl.textContent =
          "Errore durante il salvataggio. Controlla Firebase.";

        messageEl.classList.add("error");
        console.error("Errore inserimento:", error);
      } finally {
        submitButton.disabled = false;
      }
    });

    // ==========================================
    // 10. AVVIO FIREBASE
    // ==========================================

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      database = firebase.database();
      eventsRef = database.ref("calendario/eventi");

      listenForEvents();

    } catch (error) {
      statusEl.textContent =
        "Errore durante l'avvio di Firebase: " + error.message;

      console.error("Errore avvio Firebase:", error);
    }
  </script>
</body>
</html>
