```html
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario condiviso</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      margin: 0 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .date-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-row input {
      flex: 1;
      min-width: 0;
    }

    input,
    select,
    button {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: 0;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button:focus-visible,
    .event:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }

    .event {
      border-left: 6px solid;
      border-radius: 8px;
      padding: 12px 14px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s, box-shadow 0.2s;
    }

    .event:hover {
      box-shadow: 0 2px 8px #00000012;
    }

    .personale {
      border-color: #dc2626;
      background: #fee2e2;
      color: #991b1b;
    }

    .lavoro {
      border-color: #16a34a;
      background: #dcfce7;
      color: #166534;
    }

    .bambini {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .event-info {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .event-title {
      font-weight: 700;
    }

    .event-details {
      color: inherit;
      font-size: 0.95rem;
      margin-top: 3px;
    }

    .event-status {
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 5px;
    }

    .event.completed {
      opacity: 0.65;
    }

    .event.completed .event-title,
    .event.completed .event-details {
      text-decoration: line-through;
    }

    .delete {
      background: #fee2e2;
      color: #991b1b;
      padding: 7px 10px;
      flex-shrink: 0;
    }

    .delete:hover {
      background: #fecaca;
    }

    #message {
      min-height: 24px;
      color: #15803d;
      font-weight: 700;
    }

    #status {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: #4b5563;
      font-size: 0.9rem;
    }

    .empty {
      color: #6b7280;
      padding: 12px 0;
    }

    @media (max-width: 480px) {
      .date-row {
        flex-wrap: wrap;
      }

      .date-row input {
        flex-basis: 100%;
        order: -1;
      }

      .card {
        padding: 16px;
      }

      .event {
        padding: 10px;
        gap: 8px;
      }

      .delete {
        padding: 7px 8px;
      }
    }
  </style>
</head>

<body>
  <h1>Calendario condiviso</h1>

  <section class="card">
    <div class="date-row">
      <button
        class="secondary"
        id="prevDay"
        type="button"
        aria-label="Giorno precedente"
      >←</button>

      <input
        id="selectedDate"
        type="date"
        aria-label="Seleziona il giorno"
      >

      <button
        class="secondary"
        id="nextDay"
        type="button"
        aria-label="Giorno successivo"
      >→</button>

      <button
        class="secondary"
        id="today"
        type="button"
      >Oggi</button>
    </div>

    <h2 id="dayHeading"></h2>

    <div class="legend">
      <span>🔴 Personali</span>
      <span>🟢 Lavoro</span>
      <span>🔵 Bambini</span>
    </div>

    <p id="status" role="status" aria-live="polite">
      Connessione al calendario…
    </p>

    <div id="events"></div>
  </section>

  <section class="card">
    <h2>Inserisci un nuovo evento</h2>

    <form id="eventForm">
      <label>
        Descrizione dell'evento
        <input
          id="title"
          type="text"
          placeholder="Es. Visita dal dentista"
          required
          maxlength="100"
        >
      </label>

      <label>
        Categoria
        <select id="category" required>
          <option value="personale">🔴 Evento personale</option>
          <option value="lavoro">🟢 Appuntamento di lavoro</option>
          <option value="bambini">🔵 Evento riguardante i bambini</option>
        </select>
      </label>

      <label>
        Ora dell'evento
        <input id="time" type="time" required>
      </label>

      <label>
        Durata (in minuti)
        <input
          id="duration"
          type="number"
          min="1"
          step="1"
          value="60"
          required
        >
      </label>

      <button type="submit">Aggiungi evento</button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // ==========================================
    // CONFIGURAZIONE FIREBASE
    // Inserisci qui i dati REALI del tuo progetto.
    // ==========================================

    const firebaseConfig = {
      apiKey: "INSERISCI_LA_TUA_API_KEY",
      authDomain: "INSERISCI_IL_TUO_PROGETTO.firebaseapp.com",
      databaseURL: "https://INSERISCI_IL_TUO_PROGETTO-default-rtdb.firebaseio.com",
      projectId: "INSERISCI_IL_TUO_PROGETTO",
      appId: "INSERISCI_IL_TUO_APP_ID"
    };

    // ==========================================
    // ELEMENTI DELLA PAGINA
    // ==========================================

    const dateInput = document.getElementById("selectedDate");
    const eventsContainer = document.getElementById("events");
    const statusEl = document.getElementById("status");
    const messageEl = document.getElementById("message");
    const eventForm = document.getElementById("eventForm");

    let database = null;
    let eventsRef = null;
    let currentListener = null;

    // ==========================================
    // FUNZIONI PER LE DATE
    // ==========================================

    function localDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function updateHeading() {
      if (!dateInput.value) return;

      const date = new Date(dateInput.value + "T12:00:00");

      document.getElementById("dayHeading").textContent =
        new Intl.DateTimeFormat("it-IT", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(date);
    }

    // ==========================================
    // VISUALIZZAZIONE DEGLI EVENTI
    // ==========================================

    function showEvents(snapshot) {
      eventsContainer.replaceChildren();

      const events = [];

      snapshot.forEach(child => {
        const event = child.val();

        if (event && event.date === dateInput.value) {
          events.push({
            id: child.key,
            ...event
          });
        }
      });

      // Ordina gli eventi in base all'ora.
      events.sort((a, b) => {
        return (a.time || "").localeCompare(b.time || "");
      });

      if (events.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Nessun evento per questo giorno.";
        eventsContainer.appendChild(empty);
        return;
      }

      for (const event of events) {
        const item = document.createElement("div");

        const validCategories = [
          "personale",
          "lavoro",
          "bambini"
        ];

        const category = validCategories.includes(event.category)
          ? event.category
          : "personale";

        item.className = `event ${category}`;

        // Lo stato completato viene letto da Firebase.
        const completed = event.completed === true;

        if (completed) {
          item.classList.add("completed");
        }

        // Rende l'intera scheda cliccabile.
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute(
          "aria-pressed",
          completed ? "true" : "false"
        );

        item.setAttribute(
          "aria-label",
          `${event.title}. ${completed ? "Completato" : "Da fare"}. Clicca per cambiare stato.`
        );

        item.title = completed
          ? "Clicca per segnare come da fare"
          : "Clicca per segnare come fatto";

        // Contenitore delle informazioni.
        const info = document.createElement("div");
        info.className = "event-info";

        const title = document.createElement("div");
        title.className = "event-title";
        title.textContent = event.title || "Evento senza titolo";

        const details = document.createElement("div");
        details.className = "event-details";
        details.textContent =
          `${event.time || "--:--"} · ${event.duration || 60} minuti`;

        info.append(title, details);

        // Indicatore di completamento.
        const eventStatus = document.createElement("div");
        eventStatus.className = "event-status";
        eventStatus.textContent = completed
          ? "✓ Fatto"
          : "Da fare";

        info.appendChild(eventStatus);

        // Pulsante per eliminare l'evento.
        const removeButton = document.createElement("button");
        removeButton.className = "delete";
        removeButton.type = "button";
        removeButton.textContent = "Elimina";

        removeButton.setAttribute(
          "aria-label",
          `Elimina ${event.title || "evento"}`
        );

        // Evita che Elimina attivi anche il completamento.
        removeButton.addEventListener("click", async clickEvent => {
          clickEvent.stopPropagation();

          if (confirm(`Vuoi eliminare "${event.title}"?`)) {
            try {
              await eventsRef.child(event.id).remove();
            } catch (error) {
              alert("Non è stato possibile eliminare l'evento.");
              console.error(error);
            }
          }
        });

        // Clic sulla scheda: cambia lo stato.
        item.addEventListener("click", () => {
          toggleCompleted(event);
        });

        // Supporta anche tastiera: Invio e barra spaziatrice.
        item.addEventListener("keydown", keyboardEvent => {
          if (
            keyboardEvent.target === item &&
            (
              keyboardEvent.key === "Enter" ||
              keyboardEvent.key === " "
            )
          ) {
            keyboardEvent.preventDefault();
            toggleCompleted(event);
          }
        });

        item.append(info, removeButton);
        eventsContainer.appendChild(item);
      }
    }

    // ==========================================
    // COMPLETAMENTO / ANNULLAMENTO EVENTO
    // ==========================================

    async function toggleCompleted(event) {
      if (!eventsRef) return;

      const newStatus = event.completed !== true;

      try {
        await eventsRef.child(event.id).update({
          completed: newStatus
        });
      } catch (error) {
        alert(
          "Non è stato possibile salvare lo stato dell'evento. " +
          "Controlla la connessione e i permessi Firebase."
        );

        console.error(error);
      }
    }

    // ==========================================
    // SINCRONIZZAZIONE CON FIREBASE
    // ==========================================

    function listenForEvents() {
      updateHeading();

      if (!eventsRef) return;

      if (currentListener) {
        eventsRef.off("value", currentListener);
      }

      currentListener = snapshot => {
        showEvents(snapshot);
        statusEl.textContent = "Calendario online e sincronizzato.";
      };

      eventsRef.on(
        "value",
        currentListener,
        error => {
          statusEl.textContent =
            "Errore di connessione: " + error.message;
        }
      );
    }

    // ==========================================
    // NAVIGAZIONE TRA I GIORNI
    // ==========================================

    dateInput.value = localDateString(new Date());

    document.getElementById("prevDay").addEventListener("click", () => {
      const date = new Date(dateInput.value + "T12:00:00");
      date.setDate(date.getDate() - 1);

      dateInput.value = localDateString(date);
      listenForEvents();
    });

    document.getElementById("nextDay").addEventListener("click", () => {
      const date = new Date(dateInput.value + "T12:00:00");
      date.setDate(date.getDate() + 1);

      dateInput.value = localDateString(date);
      listenForEvents();
    });

    document.getElementById("today").addEventListener("click", () => {
      dateInput.value = localDateString(new Date());
      listenForEvents();
    });

    dateInput.addEventListener("change", listenForEvents);

    // ==========================================
    // INSERIMENTO DI UN NUOVO EVENTO
    // ==========================================

    eventForm.addEventListener("submit", async event => {
      event.preventDefault();
      messageEl.textContent = "";

      if (!eventsRef) {
        messageEl.textContent = "Firebase non è connesso.";
        return;
      }

      const newEvent = {
        title: document.getElementById("title").value.trim(),
        category: document.getElementById("category").value,
        date: dateInput.value,
        time: document.getElementById("time").value,
        duration: Number(
          document.getElementById("duration").value
        ),
        completed: false
      };

      if (
        !newEvent.title ||
        !newEvent.date ||
        !newEvent.time ||
        !Number.isInteger(newEvent.duration) ||
        newEvent.duration < 1
      ) {
        messageEl.textContent = "Controlla i dati inseriti.";
        return;
      }

      try {
        await eventsRef.push(newEvent);

        messageEl.textContent = "Appuntamento inserito.";

        eventForm.reset();
        document.getElementById("duration").value = 60;
      } catch (error) {
        messageEl.textContent =
          "Non è stato possibile inserire l'appuntamento.";

        console.error(error);
      }
    });

    // ==========================================
    // AVVIO DI FIREBASE
    // ==========================================

    try {
      const configIsValid =
        firebaseConfig.apiKey !== "INSERISCI_LA_TUA_API_KEY" &&
        firebaseConfig.projectId !== "INSERISCI_IL_TUO_PROGETTO" &&
        firebaseConfig.appId !== "INSERISCI_IL_TUO_APP_ID" &&
        firebaseConfig.databaseURL.includes("-default-rtdb.firebaseio.com");

      if (!configIsValid) {
        statusEl.textContent =
          "Inserisci i dati reali di Firebase nella configurazione.";
      } else {
        firebase.initializeApp(firebaseConfig);

        database = firebase.database();
        eventsRef = database.ref("calendario/eventi");

        listenForEvents();
      }
    } catch (error) {
      statusEl.textContent =
        "Errore durante l'avvio di Firebase. Controlla la configurazione.";

      console.error(error);
    }
  </script>
</body>
</html>
